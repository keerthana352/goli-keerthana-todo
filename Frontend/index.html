<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - Dashboard</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">UI</div>
            <nav class="nav-menu">
                <a href="#" class="active"><i class="fa-solid fa-house"></i></a>
                <a href="#"><i class="fa-solid fa-chart-simple"></i></a>
                <a href="#"><i class="fa-regular fa-clock"></i></a>
                <a href="#"><i class="fa-regular fa-folder"></i></a>
                <a href="#"><i class="fa-regular fa-moon"></i></a>
                <a href="#"><i class="fa-solid fa-gear"></i></a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header Icons -->
            <header class="top-header">
                <div class="header-right">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-regular fa-bell"></i>
                    <img src="https://i.pravatar.cc/40" alt="Profile" class="avatar">
                </div>
            </header>

            <h1 class="page-title">My Tasks</h1>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn">Assigned Tasks</button>
                <button class="tab-btn active">Accepted Tasks</button>
                <button class="tab-btn">Review Tasks</button>
            </div>

            <!-- Controls and Filter Bar -->
            <div class="controls-bar">
                <div class="left-controls">
                    <div class="input-box">
                        <i class="fa-regular fa-calendar"></i>
                        <span>29 July 2023</span>
                    </div>
                    <div class="input-box select-box">
                        <span>Choose Status</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <button class="btn-filter">Filter</button>
                </div>
                <button class="btn-create" id="createTaskBtn">
                    <i class="fa-solid fa-plus"></i> Create New Task
                </button>
            </div>

            <!-- Data Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Created by</th>
                            <th>Date Assigned</th>
                            <th>Due Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                        <!-- Dynamic rows via JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination Footer -->
            <footer class="pagination-footer">
                <div class="rows-per-page">
                    Rows per page:
                    <select>
                        <option>10</option>
                        <option>20</option>
                    </select>
                </div>
                <div class="page-info">1-50 of 100</div>
                <div class="page-nav">
                    <button><i class="fa-solid fa-chevron-left"></i></button>
                    <button><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </footer>
        </main>
    </div>

    <script src="Script.js"></script>
</body>
</html>
